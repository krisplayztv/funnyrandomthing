<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steamboat Willie - 1920s Cinema Experience</title>
    <style>
        body {
            font-family: "Georgia", "Times New Roman", serif;
            text-align: center;
            padding: 60px 20px;
            background-color: #151412;
            color: #e5dac3;
            margin: 0;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 3px solid #8c7853;
            outline: 12px double #4a3e29;
            outline-offset: -20px;
            pointer-events: none;
            z-index: 10;
        }

        .projector-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.015);
            pointer-events: none;
            z-index: 100;
            animation: flicker 0.15s infinite;
        }

        .projector-overlay::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            right: -50%;
            bottom: -50%;
            background: radial-gradient(circle, rgba(0,0,0,0.15) 1px, transparent 1px),
                        radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 4px 4px, 6px 6px;
            animation: grain 0.3s steps(4) infinite;
            opacity: 0.6;
        }

        .container {
            background: #23211d;
            padding: 40px 30px;
            border-radius: 2px;
            display: inline-block;
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
            border: 4px double #8c7853;
            box-shadow: 0px 15px 40px rgba(0,0,0,0.9);
            position: relative;
            z-index: 5;
        }

        h1 {
            font-size: 32px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #dfceab;
            text-shadow: 3px 3px 0px #000;
            margin-top: 0;
            margin-bottom: 30px;
            border-bottom: 2px double #8c7853;
            padding-bottom: 20px;
        }

        video {
            width: 100%;
            max-width: 100%;
            height: auto;
            background: #000;
            border: 10px solid #111;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            filter: sepia(20%) contrast(115%) brightness(95%);
            border-radius: 2px;
            box-sizing: border-box;
        }

        .credits {
            margin-top: 35px;
            font-size: 16px;
            color: #c9bda3;
            text-align: left;
            line-height: 1.9;
            border-top: 2px double #8c7853;
            padding-top: 25px;
            letter-spacing: 0.5px;
        }

        .credits h3 {
            margin: 0 0 20px 0;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #dfceab;
            text-align: center;
            text-shadow: 1px 1px #000;
        }

        .credits p {
            margin: 10px 0;
            border-bottom: 1px dotted rgba(140, 120, 83, 0.3);
            padding-bottom: 4px;
        }

        .credits strong {
            color: #dfceab;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        @keyframes flicker {
            0% { opacity: 0.97; background: rgba(255,255,255,0.01); }
            50% { opacity: 1; background: rgba(255,255,255,0.025); }
            100% { opacity: 0.98; background: rgba(255,255,255,0.015); }
        }

        @keyframes grain {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-1%, 0.5%); }
            50% { transform: translate(0.5%, -1%); }
            75% { transform: translate(-0.5%, -0.5%); }
            100% { transform: translate(0%, 0%); }
        }
    </style>
</head>
<body>

    <div class="projector-overlay"></div>

    <div class="container">
        <h1>Silent Cinema Presentation</h1>

        <video id="cinemaPlayer" controls>
            <source src="movie.webm" type="video/webm">
            Your browser does not support the video tag.
        </video>

        <div class="credits">
            <h3>Programme</h3>
            <p><strong>Feature Film:</strong> Steamboat Willie</p>
            <p><strong>Premiere:</strong> November 18, 1928 — Colony Theatre, NYC</p>
            <p><strong>Direction & Animation:</strong> Walt Disney & Ub Iwerks</p>
            <p><strong>Synchronized Sound:</strong> Powers Cinephone System</p>
            <p><strong>Status:</strong> Public Domain (United States)</p>
            <p><strong>Cinema Exhibition Designed By:</strong> KrisPlayzTV</p>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var vid = document.getElementById('cinemaPlayer');
                vid.play().catch(function(error) {
                    console.log("Autoplay blocked by browser policy. Interaction needed.");
                });
            }, 2000);
        });
    </script>

</body>
</html>
